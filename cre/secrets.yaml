# ==========================================================================
# CRE SECRETS FILE
# ==========================================================================
# Maps the secret ID your workflow requests with `runtime.getSecrets()`
# to the environment variable holding its value.
#
# In a Confidential Workflow these are released by the Vault DON directly into
# the attested enclave — they are never exposed in plaintext to node operators
# or to Workflow DON node memory.
#
# What the enclave keeps confidential:
#   - These secrets (API keys, policy thresholds)
#   - HTTP request/response payloads made from the enclave
#   - Intermediate computation values
#
# What is NOT confidential:
#   - The workflow binary (this source code)
#   - Trigger data, chain reads/writes, reports, tx calldata
secretsNames:
    GOPLUS_APP_KEY:
        - SECRET_GOPLUS_APP_KEY
    GOPLUS_APP_SECRET:
        - SECRET_GOPLUS_APP_SECRET
    ELIGIBILITY_RULEBOOK:
        - SECRET_ELIGIBILITY_RULEBOOK
    ETHERSCAN_API_KEY:
        - SECRET_ETHERSCAN_API_KEY
